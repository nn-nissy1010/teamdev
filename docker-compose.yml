version: '3.8'

volumes:
  mysql-volume: 

networks:
  app-network:
    driver: bridge

services:
  # PHPサーバー
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    volumes:
      - ./src:/var/www/html
    restart: always

  # Nginxサーバー
  web:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - php
    volumes:
      - ./src:/var/www/html  # PHP側とパスを合わせました
    restart: always

  # データベースサーバー
  db:
    build:
      context: .
      dockerfile: ./docker/mysql/Dockerfile
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-db_mydb}
      MYSQL_USER: ${DB_USER:-db_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      TZ: 'Asia/Tokyo'
    volumes:
      - ./docker/mysql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
      - mysql-volume:/var/lib/mysql # 名前付きボリュームに統一して永続化を安定させます
    restart: always

  # PHPMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      - db

  # メール確認用サーバー
  mailhog:
    image: mailhog/mailhog
    ports:
      - "${MAIL_PORT:-8025}:8025"
      - "1025:1025"
